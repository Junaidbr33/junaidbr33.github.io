
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://glcaocozpfsrjpphymuc.supabase.co";
const SUPABASE_KEY = "sb_publishable_Esc1E1g6u52Qo67ptnTSbg_rUU726yh";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

async function showNews() {
  const box = document.getElementById("newsList");
  if (!box) return;

  box.innerHTML = "न्यूज़ लोड हो रही है...";

  const { data, error } = await supabaseClient
    .from("news")
    .select("id,title,content,image_url,category,created_at")
    .eq("published", true)
    .order("created_at", { ascending: false });

  if (error) {
    box.innerHTML = "न्यूज़ लोड नहीं हुई। कृपया बाद में प्रयास करें।";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "अभी कोई न्यूज़ उपलब्ध नहीं है।";
    return;
  }

  box.innerHTML = data.map(n => `
    <article class="news-item">
      <small>${escapeHTML(n.category || "समाचार")}</small>
      <h3>${escapeHTML(n.title)}</h3>
      ${n.image_url ? `<img src="${escapeHTML(n.image_url)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px">` : ""}
      <p>${escapeHTML(n.content || "")}</p>
    </article>
  `).join("");
}

showNews();
</script>
