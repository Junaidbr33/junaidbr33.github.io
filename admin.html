
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Junaid Alam - Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5fb;font-family:Arial,sans-serif;color:#17243a}
header{background:#073477;color:white;padding:22px 16px}
main{max-width:900px;margin:20px auto;padding:0 12px}
h1{font-size:23px;margin:0}
h2{color:#073477;font-size:19px}
.card{background:white;padding:18px;margin:15px 0;border-radius:13px;box-shadow:0 3px 12px #0001}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px}
textarea{min-height:100px}
button{background:#0756b5;color:white;border:0;padding:12px 17px;border-radius:8px;font-size:15px;font-weight:bold;margin-top:12px}
.secondary{background:#e5efff;color:#073477}
.danger{background:#b42318}
.hidden{display:none}
#status{padding:12px;background:#e5efff;border-radius:8px;margin-bottom:15px;white-space:pre-wrap}
.item{border:1px solid #ddd;padding:12px;border-radius:9px;margin:10px 0}
small{color:#65748a}
</style>
</head>
<body>
<header>
<h1>MD Junaid Alam</h1>
<div>युवा समाजसेवी, समस्तीपुर — Admin Panel</div>
</header>

<main>
<div id="status">Supabase कनेक्शन तैयार हो रहा है...</div>

<section class="card" id="loginBox">
<h2>Admin Login</h2>
<form id="loginForm">
<label>ईमेल</label>
<input id="email" type="email" required>
<label>पासवर्ड</label>
<input id="password" type="password" required>
<button type="submit">लॉगिन करें</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<p id="adminName"></p>
<button id="logout" class="secondary">Logout</button>
</div>

<div class="card">
<h2>नई न्यूज़ पोस्ट करें</h2>
<form id="newsForm">
<label>न्यूज़ हेडलाइन *</label>
<input id="title" required maxlength="180">

<label>न्यूज़ विवरण</label>
<textarea id="content"></textarea>

<label>कैटेगरी</label>
<input id="category" value="समाचार">

<label>न्यूज़ फोटो</label>
<input id="newsImage" type="file" accept="image/*">

<label>वीडियो लिंक</label>
<input id="video" type="url" placeholder="https://...">

<label><input id="published" type="checkbox" checked style="width:auto"> वेबसाइट पर प्रकाशित करें</label>
<button type="submit">न्यूज़ सेव करें</button>
</form>
</div>

<div class="card">
<h2>गैलरी में फोटो जोड़ें</h2>
<form id="galleryForm">
<label>फोटो का नाम</label>
<input id="galleryTitle">
<label>फोटो चुनें *</label>
<input id="galleryImage" type="file" accept="image/*" required>
<button type="submit">फोटो अपलोड करें</button>
</form>
</div>

<div class="card">
<h2>न्यूज़ मैनेज करें</h2>
<button id="refreshNews" class="secondary">Refresh</button>
<div id="newsList"></div>
</div>

<div class="card">
<h2>गैलरी मैनेज करें</h2>
<button id="refreshGallery" class="secondary">Refresh</button>
<div id="galleryList"></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://glcaocozpfsrjpphymuc.supabase.co";
const SUPABASE_KEY="sb_publishable_Esc1E1g6u52Qo67ptnTSbg_rUU726yh";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const BUCKET="junaid-media";

function msg(t,error=false){
$("status").textContent=t;
$("status").style.background=error?"#ffe8e8":"#e5efff";
}

function safe(t){
return String(t??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

async function checkAdmin(user){
const {data,error}=await db.from("admin_users")
.select("user_id").eq("user_id",user.id).maybeSingle();

if(error||!data){
await db.auth.signOut();
msg("आपके खाते को Admin अनुमति नहीं मिली। Supabase में admin_users की जाँच करें।",true);
return false;
}
$("loginBox").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("adminName").textContent="लॉगिन: "+user.email;
await loadNews();
await loadGallery();
msg("Admin Panel में आपका स्वागत है।");
return true;
}

$("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
msg("लॉगिन हो रहा है...");
const {data,error}=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});
if(error){msg("लॉगिन असफल: "+error.message,true);return;}
await checkAdmin(data.user);
});

$("logout").addEventListener("click",async()=>{
await db.auth.signOut();
$("dashboard").classList.add("hidden");
$("loginBox").classList.remove("hidden");
msg("आप लॉगआउट हो गए हैं।");
});

async function uploadImage(file){
if(!file)return null;
if(!file.type.startsWith("image/"))throw new Error("कृपया सही फोटो चुनें।");
const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
const {error}=await db.storage.from(BUCKET).upload(path,file,{upsert:false});
if(error)throw error;
const {data}=db.storage.from(BUCKET).getPublicUrl(path);
return data.publicUrl;
}

$("newsForm").addEventListener("submit",async e=>{
e.preventDefault();
try{
msg("न्यूज़ सेव हो रही है...");
const image=await uploadImage($("newsImage").files[0]);
const {error}=await db.from("news").insert({
title:$("title").value.trim(),
content:$("content").value.trim(),
category:$("category").value.trim()||"समाचार",
image_url:image,
video_url:$("video").value.trim()||null,
published:$("published").checked
});
if(error)throw error;
$("newsForm").reset();
$("category").value="समाचार";
$("published").checked=true;
msg("न्यूज़ सफलतापूर्वक सेव हो गई।");
await loadNews();
}catch(err){msg("त्रुटि: "+err.message,true);}
});

$("galleryForm").addEventListener("submit",async e=>{
e.preventDefault();
try{
msg("फोटो अपलोड हो रही है...");
const url=await uploadImage($("galleryImage").files[0]);
const {error}=await db.from("gallery").insert({
title:$("galleryTitle").value.trim()||"फोटो",
image_url:url
});
if(error)throw error;
$("galleryForm").reset();
msg("फोटो गैलरी में जोड़ दी गई।");
await loadGallery();
}catch(err){msg("त्रुटि: "+err.message,true);}
});

async function loadNews(){
const box=$("newsList");
box.textContent="लोड हो रहा है...";
const {data,error}=await db.from("news")
.select("*").order("created_at",{ascending:false}).limit(100);
if(error){box.textContent=error.message;return;}
box.innerHTML="";
if(!data.length){box.textContent="अभी कोई न्यूज़ नहीं है।";return;}
data.forEach(n=>{
const div=document.createElement("div");
div.className="item";
div.innerHTML="<b>"+safe(n.title)+"</b><br><small>"+
(n.published?"प्रकाशित":"ड्राफ्ट")+"</small><br>";
const toggle=document.createElement("button");
toggle.className="secondary";
toggle.textContent=n.published?"ड्राफ्ट करें":"प्रकाशित करें";
toggle.onclick=()=>toggleNews(n.id,!n.published);
const del=document.createElement("button");
del.className="danger";
del.textContent="डिलीट";
del.onclick=()=>deleteNews(n.id);
div.append(toggle,del);
box.appendChild(div);
});
}

async function toggleNews(id,value){
const {error}=await db.from("news").update({published:value}).eq("id",id);
if(error){msg(error.message,true);return;}
msg("न्यूज़ की स्थिति बदल गई।");
await loadNews();
}

async function deleteNews(id){
if(!confirm("क्या आप यह न्यूज़ डिलीट करना चाहते हैं?"))return;
const {error}=await db.from("news").delete().eq("id",id);
if(error){msg(error.message,true);return;}
msg("न्यूज़ डिलीट हो गई।");
await loadNews();
}

async function loadGallery(){
const box=$("galleryList");
box.textContent="लोड हो रहा है...";
const {data,error}=await db.from("gallery")
.select("*").order("created_at",{ascending:false}).limit(100);
if(error){box.textContent=error.message;return;}
box.innerHTML="";
if(!data.length){box.textContent="गैलरी खाली है।";return;}
data.forEach(g=>{
const div=document.createElement("div");
div.className="item";
div.innerHTML="<b>"+safe(g.title)+"</b><br><a href='"+safe(g.image_url)+"' target='_blank'>फोटो देखें</a>";
const del=document.createElement("button");
del.className="danger";
del.textContent="डिलीट";
del.onclick=async()=>{
if(!confirm("क्या यह फोटो डिलीट करें?"))return;
const {error}=await db.from("gallery").delete().eq("id",g.id);
if(error){msg(error.message,true);return;}
msg("फोटो रिकॉर्ड डिलीट हो गया।");
await loadGallery();
};
div.appendChild(del);
box.appendChild(div);
});
}

$("refreshNews").onclick=loadNews;
$("refreshGallery").onclick=loadGallery;

(async()=>{
const {data,error}=await db.auth.getSession();
if(error){msg(error.message,true);return;}
if(data.session)await checkAdmin(data.session.user);
else msg("Admin लॉगिन करें।");
})();
</script>
</body>
</html>
